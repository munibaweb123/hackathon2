name: CD - GKE Production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (commit SHA or 'latest')"
        required: true
        default: "latest"
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - staging
          - production

env:
  GCP_REGION: us-central1
  GKE_CLUSTER: todo-app-cluster
  NAMESPACE: todo-app
  HELM_RELEASE: todo-app

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        run: |
          if [ "${{ inputs.tag }}" = "latest" ]; then
            TAG="${{ github.sha }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG}"

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/todo-app/backend:${{ steps.meta.outputs.tag }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/todo-app/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/todo-app/frontend:${{ steps.meta.outputs.tag }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/todo-app/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ secrets.DOMAIN }}/api
            NEXT_PUBLIC_WS_URL=wss://${{ secrets.DOMAIN }}/ws

      - name: Build and push Notification Service
        if: hashFiles('infra/docker/notification.Dockerfile') != ''
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./infra/docker/notification.Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/todo-app/notification:${{ steps.meta.outputs.tag }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/todo-app/notification:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Recurring Service
        if: hashFiles('infra/docker/recurring.Dockerfile') != ''
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./infra/docker/recurring.Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/todo-app/recurring:${{ steps.meta.outputs.tag }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/todo-app/recurring:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Audit Service
        if: hashFiles('infra/docker/audit.Dockerfile') != ''
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./infra/docker/audit.Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/todo-app/audit:${{ steps.meta.outputs.tag }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/todo-app/audit:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to GKE
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    environment:
      name: ${{ inputs.environment }}
      url: https://${{ secrets.DOMAIN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          install_components: "gke-gcloud-auth-plugin"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Get Cloud SQL instance info
        id: cloudsql
        run: |
          CONNECTION_NAME=$(gcloud sql instances describe todo-postgres \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format="value(connectionName)" 2>/dev/null || echo "")
          echo "connection_name=${CONNECTION_NAME}" >> $GITHUB_OUTPUT

      - name: Deploy with Helm
        run: |
          # Determine values file based on environment
          if [ "${{ inputs.environment }}" = "production" ]; then
            VALUES_FILE="infra/helm/todo-app/values-gke.yaml"
          else
            VALUES_FILE="infra/helm/todo-app/values-gke.yaml"
          fi

          # Get image tag
          TAG="${{ needs.build-and-push.outputs.image_tag || inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.sha }}"
          fi

          # Deploy with Helm
          helm upgrade --install ${{ env.HELM_RELEASE }} infra/helm/todo-app \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            -f ${VALUES_FILE} \
            --set images.backend.repository=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/todo-app/backend \
            --set images.backend.tag=${TAG} \
            --set images.frontend.repository=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/todo-app/frontend \
            --set images.frontend.tag=${TAG} \
            --set images.notification.repository=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/todo-app/notification \
            --set images.notification.tag=${TAG} \
            --set images.recurring.repository=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/todo-app/recurring \
            --set images.recurring.tag=${TAG} \
            --set images.audit.repository=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/todo-app/audit \
            --set images.audit.tag=${TAG} \
            --set backend.corsOrigins="https://${{ secrets.DOMAIN }}" \
            --set frontend.apiUrl="https://${{ secrets.DOMAIN }}/api" \
            --set frontend.wsUrl="wss://${{ secrets.DOMAIN }}/ws" \
            --set ingress.host="${{ secrets.DOMAIN }}" \
            --set cloudSqlProxy.instanceConnectionName="${{ steps.cloudsql.outputs.connection_name }}" \
            --set serviceAccount.annotations."iam\.gke\.io/gcp-service-account"="todo-app-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --set postgresql.enabled=false \
            --wait \
            --timeout 600s

      - name: Verify deployment
        run: |
          echo "Checking deployment status..."
          kubectl rollout status deployment/${{ env.HELM_RELEASE }}-backend \
            --namespace ${{ env.NAMESPACE }} \
            --timeout=300s

          kubectl rollout status deployment/${{ env.HELM_RELEASE }}-frontend \
            --namespace ${{ env.NAMESPACE }} \
            --timeout=300s

          echo ""
          echo "Pod status:"
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide

          echo ""
          echo "Service status:"
          kubectl get svc -n ${{ env.NAMESPACE }}

          echo ""
          echo "Ingress status:"
          kubectl get ingress -n ${{ env.NAMESPACE }}

      - name: Get deployment URL
        run: |
          echo "Deployment complete!"
          echo ""
          echo "Application URL: https://${{ secrets.DOMAIN }}"
          echo "API URL: https://${{ secrets.DOMAIN }}/api"

  notify:
    name: Notify
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Deployment Status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "✅ Deployment successful!"
            echo "Environment: ${{ inputs.environment }}"
            echo "Image Tag: ${{ inputs.tag }}"
          else
            echo "❌ Deployment failed!"
            exit 1
          fi
