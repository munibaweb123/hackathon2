apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: todo-app-alerts
  namespace: monitoring
  labels:
    app: todo-app
spec:
  groups:
    - name: todo-app.rules
      rules:
        - alert: HighErrorRate
          expr: sum(rate(http_requests_total{status=~"5..", app_id="backend"}[5m])) / sum(rate(http_requests_total{app_id="backend"}[5m])) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High error rate on backend"
            description: "Error rate is above 5% for 5 minutes"

        - alert: HighLatency
          expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{app_id="backend"}[5m])) by (le)) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High p95 latency on backend"
            description: "P95 latency is above 500ms for 5 minutes"

        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace="todo-app"}[15m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: "Pod has restarted in the last 15 minutes"

        - alert: PodNotReady
          expr: kube_pod_status_ready{namespace="todo-app", condition="true"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is not ready"
            description: "Pod has been not ready for 10 minutes"

        - alert: HighMemoryUsage
          expr: sum(container_memory_usage_bytes{namespace="todo-app"}) by (pod) / sum(container_spec_memory_limit_bytes{namespace="todo-app"}) by (pod) > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage for {{ $labels.pod }}"
            description: "Memory usage is above 90% of limit"
