# Docker Compose for Local Development
# Includes all services with Dapr sidecars, PostgreSQL, and Redpanda

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: todo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redpanda (Kafka-compatible)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.3
    container_name: todo-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - "18081:18081"  # Schema registry
      - "18082:18082"  # Pandaproxy
      - "19092:19092"  # Kafka external
      - "19644:9644"   # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    container_name: todo-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/todo
      BETTER_AUTH_SECRET: dev-secret-key
      DAPR_HTTP_PORT: 3500
      PUBSUB_NAME: kafka-pubsub
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Dapr Sidecar
  backend-dapr:
    image: "daprio/daprd:1.12.0"
    container_name: todo-backend-dapr
    command: ["./daprd",
      "-app-id", "backend",
      "-app-port", "8000",
      "-dapr-http-port", "3500",
      "-dapr-grpc-port", "50001",
      "-components-path", "/components",
      "-config", "/config/config.yaml"]
    volumes:
      - ../../infra/helm/dapr-components:/components
      - ../../infra/helm/dapr-components:/config
    network_mode: "service:backend"
    depends_on:
      - backend

  # Frontend
  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
    container_name: todo-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Notification Service
  notification:
    build:
      context: ../..
      dockerfile: infra/docker/notification.Dockerfile
    container_name: todo-notification
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/todo
      DAPR_HTTP_PORT: 3501
      PUBSUB_NAME: kafka-pubsub
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redpanda
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Notification Dapr Sidecar
  notification-dapr:
    image: "daprio/daprd:1.12.0"
    container_name: todo-notification-dapr
    command: ["./daprd",
      "-app-id", "notification",
      "-app-port", "8001",
      "-dapr-http-port", "3501",
      "-dapr-grpc-port", "50002",
      "-components-path", "/components",
      "-config", "/config/config.yaml"]
    volumes:
      - ../../infra/helm/dapr-components:/components
      - ../../infra/helm/dapr-components:/config
    network_mode: "service:notification"
    depends_on:
      - notification

  # Recurring Task Service
  recurring:
    build:
      context: ../..
      dockerfile: infra/docker/recurring.Dockerfile
    container_name: todo-recurring
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/todo
      DAPR_HTTP_PORT: 3502
      PUBSUB_NAME: kafka-pubsub
    ports:
      - "8002:8002"
    depends_on:
      - postgres
      - redpanda
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Recurring Dapr Sidecar
  recurring-dapr:
    image: "daprio/daprd:1.12.0"
    container_name: todo-recurring-dapr
    command: ["./daprd",
      "-app-id", "recurring",
      "-app-port", "8002",
      "-dapr-http-port", "3502",
      "-dapr-grpc-port", "50003",
      "-components-path", "/components",
      "-config", "/config/config.yaml"]
    volumes:
      - ../../infra/helm/dapr-components:/components
      - ../../infra/helm/dapr-components:/config
    network_mode: "service:recurring"
    depends_on:
      - recurring

  # Audit Service
  audit:
    build:
      context: ../..
      dockerfile: infra/docker/audit.Dockerfile
    container_name: todo-audit
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/todo
      DAPR_HTTP_PORT: 3503
      PUBSUB_NAME: kafka-pubsub
    ports:
      - "8003:8003"
    depends_on:
      - postgres
      - redpanda
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Audit Dapr Sidecar
  audit-dapr:
    image: "daprio/daprd:1.12.0"
    container_name: todo-audit-dapr
    command: ["./daprd",
      "-app-id", "audit",
      "-app-port", "8003",
      "-dapr-http-port", "3503",
      "-dapr-grpc-port", "50004",
      "-components-path", "/components",
      "-config", "/config/config.yaml"]
    volumes:
      - ../../infra/helm/dapr-components:/components
      - ../../infra/helm/dapr-components:/config
    network_mode: "service:audit"
    depends_on:
      - audit

volumes:
  postgres_data:
  redpanda_data:

networks:
  default:
    name: todo-network
