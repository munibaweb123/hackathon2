# Default values for todo-app
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  environment: development

backend:
  replicaCount: 1
  image:
    repository: todo-backend
    tag: v1.0.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  logLevel: INFO

frontend:
  replicaCount: 1
  image:
    repository: todo-frontend
    tag: v1.0.0
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 3000
    nodePort: 30000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

database:
  external:
    enabled: false
    host: ""
    port: 5432
    database: todo_db
    username: todo_user
  internal:
    enabled: true
    image: postgres:15-alpine
    persistence:
      enabled: true
      size: 1Gi
      storageClass: standard
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: todo.local
  # Enable TLS for HTTPS (required for voice input on non-localhost)
  tls: false
  # For self-signed certs, these will be generated by external secret management
  tlsCert: ""
  tlsKey: ""

networkPolicy:
  enabled: false

serviceAccount:
  create: true
  annotations: {}
  name: ""

migration:
  enabled: false

config:
  corsOrigins: '["http://localhost:3000", "http://127.0.0.1:3000"]'
  jwtExpiration: 3600
  frontendApiUrl: "http://todo-app-backend:8000"

# IMPORTANT: These are development defaults
# For production, use external secret management (External Secrets Operator, Sealed Secrets, etc.)
secrets:
  databaseUrl: "postgresql://neondb_owner:npg_58GBtdLMTCJD@ep-gentle-tooth-adhd8nnt-pooler.c-2.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
  databaseUsername: "neondb_owner"
