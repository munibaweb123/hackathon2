name: CI

on:
  push:
    branches: [main, "004-advanced-cloud-deploy"]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - run: pip install pytest pytest-asyncio
      - run: pytest backend/tests/ -v
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/todo_test

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
        timeout-minutes: 5
        continue-on-error: true
      - name: Build
        run: npm run build
        working-directory: frontend
        timeout-minutes: 10

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    strategy:
      matrix:
        service:
          - { name: backend, file: infra/docker/backend.Dockerfile }
          - { name: frontend, file: infra/docker/frontend.Dockerfile }
          - { name: notification, file: infra/docker/notification.Dockerfile }
          - { name: recurring, file: infra/docker/recurring.Dockerfile }
          - { name: audit, file: infra/docker/audit.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f ${{ matrix.service.file }} -t todo-${{ matrix.service.name }}:test .
